<script>
window.DM_CONFIG = {

<script>
/* ============================================================================
   لایهٔ ابری — اتصال از طریق Supabase + لایسنس (منبع اصلی داده)
   ----------------------------------------------------------------------------
   • داده دیگر در دیتابیس مرورگر نگه‌داری نمی‌شود؛ فقط در حافظهٔ همان نشست
     نگه داشته می‌شود و منبع اصلی Supabase است.
   • اتصال هر برنامه با «کلید لایسنس» برقرار می‌شود؛ پاسخ شامل
     مرکز، مجوز این برنامه و توکن نشست است.
   • خواندن: کل دادهٔ مرکز یک‌بار گرفته و بعد هر چند ثانیه تغییرات از پایگاه
     خوانده می‌شود (revision).
   • نوشتن: هر تغییر به یک صف می‌رود و به‌صورت دسته‌ای به پایگاه فرستاده می‌شود.
   • اگر URL/کلید تنظیم نشده باشد، برنامه در «حالت محلی» و مثل قبل کار می‌کند
     تا آزمون ظاهری ممکن بماند.
   ========================================================================= */
(function () {
  'use strict';

  var APP = window.CLINIC_SUITE_APP || window.CLINIC_PANEL_ROLE || 'admin';
  var LABELS = { admin: 'پنل مدیریت', secretary: 'پنل منشی', attendance: 'ورود و خروج' };

  var cfg = window.DM_CONFIG || {};
  var URL_BASE = String(cfg.SUPABASE_URL || '').replace(/\/+$/, '');
  var ANON = String(cfg.SUPABASE_ANON_KEY || '');
  var MODE = String(cfg.CLOUD_MODE || 'auto').toLowerCase();
  var POLL_MS = Math.max(2000, Number(cfg.POLL_MS || 5000));
  var SESSION_KEY = 'suite_session_' + APP;   // نشست هر برنامه جداست (بدون پیشوند clinic تا مرکز‌محور نشود)
  var DEVICE_KEY = 'suite_device_id';

  var enabled = MODE !== 'local' && !!URL_BASE && !!ANON;
  var configured = !!(URL_BASE && ANON);

  var state = {
    active: false,
    session: null,
    revision: 0,
    snapshot: {},        // entity -> Map(id -> row)
    known: {},           // entity -> Map(id -> json)  (برای تشخیص تغییر)
    queue: [],
    sending: false,
    lastSync: 0,
    lastError: '',
    sessions: [],
    timer: null,
  };

  /* ---------- ابزار ------------------------------------------------------- */
  function deviceId() {
    try {
      var id = localStorage.getItem(DEVICE_KEY);
      if (!id) { id = 'dev-' + Math.random().toString(36).slice(2, 10); localStorage.setItem(DEVICE_KEY, id); }
      return id;
    } catch (e) {
      return 'dev-session';
    }
  }

  function deviceName() {
    var ua = navigator.userAgent || '';
    var os = /android/i.test(ua) ? 'اندروید' : /iphone|ipad|ipod/i.test(ua) ? 'iOS' : /windows/i.test(ua) ? 'ویندوز' : /mac/i.test(ua) ? 'مک' : 'دستگاه';
    var browser = /edg/i.test(ua) ? 'Edge' : /chrome/i.test(ua) ? 'Chrome' : /firefox/i.test(ua) ? 'Firefox' : /safari/i.test(ua) ? 'Safari' : 'مرورگر';
    return os + ' · ' + browser;
  }

  /* کلید جدید (sb_publishable_…) فقط در apikey می‌رود؛ کلید قدیمی JWT در Authorization هم لازم دارد */
  function authHeaders() {
    var h = { 'content-type': 'application/json', apikey: ANON, 'x-client-info': 'clinic-suite/' + APP };
    if (/^eyJ/.test(ANON)) h.authorization = 'Bearer ' + ANON;
    return h;
  }

  async function rpc(fn, body) {
    if (!configured) throw new Error('تنظیمات اتصال ناقص است');
    var res;
    try {
      res = await fetch(URL_BASE + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(body || {}),
      });
    } catch (e) {
      throw new Error('ارتباط برقرار نشد');
    }
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = { error: text }; }
    if (!res.ok) {
      var msg = (data && (data.message || data.error || data.hint)) || ('خطا (' + res.status + ')');
      throw new Error(msg);
    }
    return data;
  }

  /* ---------- نشست -------------------------------------------------------- */
  function readSession() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function writeSession(value) {
    try {
      if (value) localStorage.setItem(SESSION_KEY, JSON.stringify(value));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function sessionValid() {
    var s = readSession();
    if (!s || !s.token) return false;
    if (s.expiresAt && Date.parse(s.expiresAt) < Date.now()) return false;
    return true;
  }

  /* ---------- همگام‌سازی داده -------------------------------------------- */
  function entityValue(entity) {
    var rows = state.snapshot[entity];
    if (!rows) return entity === 'cfg' ? {} : [];
    if (entity === 'cfg') {
      var row = rows.get('cfg');
      return row ? row.data : {};
    }
    var list = [];
    rows.forEach(function (row) { if (!row.deleted) list.push(row.data); });
    return list;
  }

  function hydrate(entity) {
    if (typeof Store === 'undefined' || typeof Store.hydrate !== 'function') return;
    Store.hydrate(entity, entityValue(entity));
  }

  function setSnapshotRecord(record) {
    var entity = String(record.entity);
    if (!state.snapshot[entity]) state.snapshot[entity] = new Map();
    if (!state.known[entity]) state.known[entity] = new Map();
    var id = String(record.id);
    if (record.deleted) {
      state.snapshot[entity].delete(id);
      state.known[entity].delete(id);
      return;
    }
    var json = JSON.stringify(record.data);
    state.snapshot[entity].set(id, { id: id, data: record.data });
    state.known[entity].set(id, json);
  }

  function applyRemote(records) {
    if (!records || !records.length) return false;
    var entities = {};
    records.forEach(function (record) {
      setSnapshotRecord(record);
      entities[record.entity] = true;
    });
    Object.keys(entities).forEach(hydrate);
    repaint();
    return true;
  }

  function repaint(entity) {
    if (entity) hydrate(entity);
    if (document.querySelector('.ov')) return;
    if (typeof App !== 'undefined' && typeof App.refresh === 'function') {
      try { App.refresh(); } catch (e) {}
    }
    if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
  }

  function collectWrites(entity, value) {
    var rows = state.snapshot[entity] || (state.snapshot[entity] = new Map());
    var known = state.known[entity] || (state.known[entity] = new Map());
    var writes = [];
    if (entity === 'cfg') {
      var data = value && typeof value === 'object' ? value : {};
      var json = JSON.stringify(data);
      if (known.get('cfg') !== json) {
        rows.set('cfg', { id: 'cfg', data: data });
        known.set('cfg', json);
        writes.push({ entity: entity, id: 'cfg', data: data });
      }
      return writes;
    }
    var list = Array.isArray(value) ? value : [];
    var seen = {};
    list.forEach(function (item) {
      if (!item || item.id == null) return;
      var id = String(item.id);
      seen[id] = true;
      var json = JSON.stringify(item);
      if (known.get(id) !== json) {
        rows.set(id, { id: id, data: item });
        known.set(id, json);
        writes.push({ entity: entity, id: id, data: item });
      }
    });
    Array.from(rows.keys()).forEach(function (id) {
      if (!seen[id]) {
        rows.delete(id);
        known.delete(id);
        writes.push({ entity: entity, id: id, deleted: true });
      }
    });
    return writes;
  }

  function onSave(entity, value) {
    if (!state.active) return;
    var writes = collectWrites(String(entity), value);
    if (!writes.length) return;
    state.queue = state.queue.concat(writes);
    send();
  }

  var sendTimer = null;

  /* لایسنس لغو/منقضی شد یا دستگاه از پایگاه خارج شد: برنامه قفل و صفحهٔ اتصال نمایش داده می‌شود */
  function isAuthError(text) {
    var s = String(text || '');
    if (/ارتباط|شبکه|network|Failed to fetch|TypeError|timeout|زمان‌قطع|قطع/i.test(s)) return false;
    return /نشست معتبر نیست|لایسنس این نشست|مرکز این نشست|لایسنس غیرفعال|مهلت این لایسنس|منقضی شده/.test(s);
  }
  function lockOut(message) {
    clearInterval(state.timer);
    clearTimeout(sendTimer);
    state.active = false;
    state.session = null;
    state.queue = [];
    writeSession(null);
    showGate(message);
  }
  function send() {
    if (!state.active || state.sending || !state.queue.length) return;
    clearTimeout(sendTimer);
    sendTimer = setTimeout(flush, 320);
  }

  async function flush() {
    if (!state.active || state.sending || !state.queue.length) return;
    state.sending = true;
    var batch = state.queue.splice(0, 300);
    try {
      var result = await rpc('clinic_api', {
        p_token: state.session.token,
        p_action: 'push',
        p_payload: { writes: batch },
      });
      if (result && result.error) throw new Error(result.error);
      if (result && result.rev) state.revision = Number(result.rev);
      state.lastSync = Date.now();
      state.lastError = '';
      if (result && result.sessions) state.sessions = result.sessions;
    } catch (error) {
      state.lastError = String(error.message || error);
      if (isAuthError(state.lastError)) { state.sending = false; lockOut(state.lastError); return; }
      state.queue = batch.concat(state.queue);
      if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
      setTimeout(send, 4000);
      state.sending = false;
      return;
    }
    state.sending = false;
    if (state.queue.length) send();
    if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
  }

  async function poll() {
    if (!state.active) return;
    try {
      var result = await rpc('clinic_api', {
        p_token: state.session.token,
        p_action: 'pull',
        p_payload: { since: state.revision },
      });
      if (result && result.error) throw new Error(result.error);
      if (result && result.rev) state.revision = Number(result.rev);
      if (result && result.sessions) state.sessions = result.sessions;
      state.lastSync = Date.now();
      state.lastError = '';
      applyRemote(result && result.records);
      if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
    } catch (error) {
      state.lastError = String(error.message || error);
      if (isAuthError(state.lastError)) lockOut(state.lastError);
    }
  }

  /* ---------- ورود با لایسنس -------------------------------------------- */
  async function login(license) {
    var result = await rpc('clinic_login', {
      p_license: String(license || '').trim(),
      p_panel: APP,
      p_device: deviceId() + '|' + deviceName(),
    });
    if (!result || result.ok !== true) throw new Error((result && result.error) || 'ورود ناموفق بود');
    var session = {
      token: result.token,
      center: result.center,
      centers: result.centers || (result.center ? [result.center] : []),
      license: result.license,
      person: result.person || null,
      panel: APP,
      savedAt: new Date().toISOString(),
      expiresAt: result.expires_at || null,
    };
    writeSession(session);
    state.session = session;
    if (result.person && result.person.id) {
      try { localStorage.setItem('clinic_activeSecretary', JSON.stringify(String(result.person.id))); } catch (e) {}
    }
    await start(true);
    return session;
  }

  function logout() {
    var s = readSession();
    if (s && s.token) {
      rpc('clinic_api', { p_token: s.token, p_action: 'logout', p_payload: {} }).catch(function () {});
    }
    writeSession(null);
    state.active = false;
    state.session = null;
    state.snapshot = {};
    state.known = {};
    state.queue = [];
    clearInterval(state.timer);
    if (typeof Store !== 'undefined' && Store.clearMem) Store.clearMem();
    location.reload();
  }

  /* ---------- راه‌اندازی -------------------------------------------------- */
  var META_KEYS = ['clinic_centers', 'clinic_licenses', 'clinic_adminCenter', 'clinic_testCenter',
                   'clinic_licenseSession', 'clinicAppearanceMode'];

  /* در حالت ابری هیچ دادهٔ پنلی در مرورگر نگه داشته نمی‌شود؛ بازماندهٔ حالت محلی پاک می‌شود */
  function purgeBrowserData() {
    try {
      var keys = [];
      for (var i = 0; i < localStorage.length; i += 1) keys.push(localStorage.key(i));
      keys.forEach(function (key) {
        if (!key || key.indexOf('clinic') !== 0) return;
        if (META_KEYS.indexOf(key) >= 0) return;
        if (key.indexOf('clinic_cache_') === 0) return; // keep offline cache
        localStorage.removeItem(key);
      });
    } catch (e) {}
  }

  function centerApplied(session) {
    try {
      var center = session.center || {};
      var centers = [{ id: center.id || ('c_'+Date.now()), name: center.name || 'مرکز بدون نام', active: true }];
      localStorage.setItem('clinic_centers', JSON.stringify(centers));
      localStorage.setItem('clinic_adminCenter', centers[0].id);
      localStorage.setItem('clinic_testCenter', centers[0].id);
    } catch (e) {}
  }

  async function start(fromLogin) {
    var session = state.session || readSession();
    if (!session || !session.token) return false;
    state.session = session;
    centerApplied(session);
    var result = await rpc('clinic_api', {
      p_token: session.token,
      p_action: 'pull',
      p_payload: { since: null },
    });
    if (!result || result.error) throw new Error((result && result.error) || 'دریافت داده ناموفق بود');
    state.snapshot = {};
    state.known = {};
    state.revision = Number(result.rev || 0);
    state.sessions = result.sessions || [];
    (result.records || []).forEach(setSnapshotRecord);
    state.active = true;
    purgeBrowserData();
    if (typeof Store !== 'undefined' && Store.clearMem) Store.clearMem();

  /* ---------- دروازهٔ اتصال (بدون لایسنس، برنامه باز نمی‌شود) ------------- */
  function gateStyles() {

  function showGate(message) {

    });

    if (first) setTimeout(function () { first.focus({ preventScroll: true }); }, 120);

  function boot() {
    if (!enabled) return;              // حالت محلی: چیزی تغییر نمی‌کند
    if (!sessionValid()) { showGate(''); return; }

    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function numToWordsFa(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n===0) return 'صفر';
  const yekan=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const dahgan=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const dahyek=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const sadgan=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const scale=['','هزار','میلیون','میلیارد','بیلیون','تریلیون'];
  const three = x => {
    const s=[];
    const h=Math.floor(x/100), r=x%100;
    if(h) s.push(sadgan[h]);
    if(r>=10 && r<20) s.push(dahyek[r-10]);
    else {
      const d=Math.floor(r/10), y=r%10;
      if(d) s.push(dahgan[d]);
      if(y) s.push(yekan[y]);
    }
    return s.join(' و ');
  };
  const parts=[];
  let i=0;
  while(n>0){
    const chunk = n % 1000;
    if(chunk){
      const w = three(chunk);
      parts.unshift(w + (scale[i] ? ' ' + scale[i] : ''));
    }
    n = Math.floor(n/1000);
    i++;
  }
  return parts.join(' و ');
}

function money(n){
  const v = Number(n||0);
  const abs = Math.floor(Math.abs(v));
  const grouped = fa(abs.toLocaleString('en-US'));
  const sign = v<0 ? '−' : '';
  return `${sign}${grouped} تومان`;
}

// گروه‌بندی زندهٔ ورودی مبلغ
function maskMoneyInput(inp){

// ورودی مبلغ با قالب عددی و پیش‌نمایش
function toAsciiDigits(value){

    .replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));

}
function bindMoneyFields(scope){

      const raw = toAsciiDigits(inp.value).replace(/[^\d]/g,'');

  $$('[data-time]',scope).forEach(inp=>{

}
const pad=n=>String(n).padStart(2,'0');
function g2j(gy,gm,gd){const t=[0,31,59,90,120,151,181,212,243,273,304,334];const y2=gm>2?gy+1:gy;
 let d=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+t[gm-1];

const TZ = 'Asia/Tehran';

function tehranParts(){
  const fmt = new Intl.DateTimeFormat('en-GB',{
    timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  });
  const parts = fmt.formatToParts(new Date());
  const get = t => parts.find(p=>p.type===t)?.value || '0';
  return {
    gy:+get('year'), gm:+get('month'), gd:+get('day'),
    hh:+get('hour'), mm:+get('minute'), ss:+get('second')
  };
}

function T(){
  const t = tehranParts();
  const [y,m,d] = g2j(t.gy, t.gm, t.gd);

    time: `${pad(t.hh)}:${pad(t.mm)}`,

  calTab($('#planningCalendar',el));workshopReminderPanel(el);
  const render=()=>{
    const q=$('#planningQuery',el).value.trim().toLowerCase();
    const rows=Store.all('appts').slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.time||'').localeCompare(String(b.time||''))).filter(a=>(pname(a.cid)+' '+pname(a.tid)+' '+(a.date||'')+' '+(a.time||'')).toLowerCase().includes(q));
    $('#planningList',el).innerHTML=rows.length?rows.map(a=>{
      const cancelled=a.status==='cancelled',done=!!a.done||a.status==='done',running=a.status==='in_progress';
      const status=cancelled?'<span class="bad">لغوشده</span>':done?'<span class="ok">جلسه پایان‌یافته</span>':running?'<span class="warn">جلسه در جریان است</span>':'<span class="mut">برنامه‌ریزی‌شده</span>';
      return `<div class="card"><div class="row"><div class="g"><b>${fa(a.date||'')} · ${fa(a.time||'—')} · ${esc(pname(a.cid))} · پرونده ${fa(pfile(a.cid)||'—')}</b><div class="mut">${a.serviceMode==='online'?'شیوه: آنلاین':'شیوه: حضوری'} · درمانگر: ${therapistChip(a.tid)}${a.note?' · '+esc(a.note):''}${appointmentDepositAmount(a.id)?' · بیعانه '+money(appointmentDepositAmount(a.id)):''}</div>${cancelled?`<div class="mut bad">دلیل: ${esc(a.cancelReasonLabel||a.cancelNote||'—')}</div>`:''}</div>${status}</div><div class="row" style="margin-top:8px"><button class="btn sm sec" data-plan-day="${esc(a.date||'')}">نمایش روز در تقویم</button>${!cancelled&&!done&&!running?`<button class="btn sm bad" data-plan-cancel="${a.id}">لغو نوبت</button>`:''}</div></div>`;
    }).join(''):'<div class="empty">نوبتی ثبت نشده است.</div>';
    $$('[data-plan-day]',el).forEach(b=>b.onclick=()=>daySheet(b.dataset.planDay));
    $$('[data-plan-cancel]',el).forEach(b=>b.onclick=()=>cancelAppointmentSheet(b.dataset.planCancel));
  };
  $('#planningQuery',el).oninput=render;render();
}

 if(b)b.ids.forEach(id=>smsSetStatus(id,d.ok?((d.failed||0)>0?'check':'sent'):'failed'));
 SMSX.ui&&SMSX.ui.done&&SMSX.ui.done(d);
};
window.onSmsResult=function(d){
 d=d||{};let w=SMSX.waiters[d.phone];
 if(w)delete SMSX.waiters[d.phone];
 else if(!d.phone){const k=Object.keys(SMSX.waiters)[0];if(k){w=SMSX.waiters[k];delete SMSX.waiters[k]}}
 if(w){smsSetStatus(w.id,d.ok?'sent':'failed');w.res&&w.res(!!d.ok)}
 else if(d.phone){const m=Store.all('sms').find(x=>x.phone===d.phone&&(x.status==='unknown'||x.status==='pending'));if(m)smsSetStatus(m.id,d.ok?'sent':'failed')}

/* ─── ارسال جداگانه برای هر نفر (متن شخصی‌سازی‌شده) به‌صورت صف؛ هر پیام بعد از نتیجهٔ قبلی ─── */
async function smsRunPersonal(list,fillOne,ui){
 SMSX.running=true;SMSX.stop=false;let sent=0,failed=0,unk=0;const delay=list.length>50?1500:800;
 ui.start&&ui.start(list.length);
 for(let i=0;i<list.length;i++){
  if(SMSX.stop)break;
  const r=list[i],text=fillOne(r),log=smsLog(r,r.phone,text,'pending');
  const ok=await new Promise(res=>{
   const to=setTimeout(()=>{const w=SMSX.waiters[r.phone];if(w&&w.id===log.id)delete SMSX.waiters[r.phone];res(null)},25000);
   SMSX.waiters[r.phone]={id:log.id,res:v=>{clearTimeout(to);res(v)}};
   try{smsNat().sendSms(r.phone,text)}catch(e){clearTimeout(to);delete SMSX.waiters[r.phone];smsSetStatus(log.id,'failed');res(false)}
  });
  if(ok===true)sent++;else if(ok===false)failed++;else{unk++;smsSetStatus(log.id,'unknown')}
  ui.progress&&ui.progress({current:i+1,total:list.length,failed:failed+unk});
  if(i<list.length-1)await new Promise(r=>setTimeout(r,delay));
 }
 SMSX.running=false;
 ui.done&&ui.done({ok:sent+unk>0,sent,failed,unknown:unk,stopped:SMSX.stop,error:(sent+unk>0?'':'send_failed')});
}

function calTab(el,o={}){let[y,m]=jp(T().month+'/01');

 const draw=()=>{const first=wd(y,m,1),ap=Store.all('appts').filter(a=>a.status!=='cancelled'),tx=Store.all('tx'),events=Store.all('events');let c='';for(let i=0;i<first;i++)c+='<div></div>';

/* ---- ورود و خروج و برنامهٔ ساعت کار ---- */
const schedFor=(pid,date)=>{const o=Store.all('ovr').find(x=>String(x.pid)===String(pid)&&x.date===date);if(o)return o.off?null:{from:o.from,to:o.to,ovr:1};const[y,m,d]=jp(date),day=wd(y,m,d),sc=Store.cfg('sch_'+pid,{from:'09:00',to:'17:00',days:[0,1,2,3,4,5]}),days=Array.isArray(sc.days)?sc.days.map(Number):[0,1,2,3,4,5];if(!days.includes(day))return null;return {...sc,days}};
const attSegments=(pid,date)=>Store.all('att').filter(a=>String(a.pid)===String(pid)&&String(a.date)===String(date)).slice().sort((a,b)=>hm(a.in||'00:00')-hm(b.in||'00:00'));
const attOpen=(pid,date)=>attSegments(pid,date).find(a=>!a.out)||null;
const attForDay=(pid,date)=>{const segments=attSegments(pid,date);if(!segments.length)return null;const open=segments.find(a=>!a.out);return{...segments[0],segments,in:segments[0].in||'',out:open?'':(segments[segments.length-1].out||''),isOpen:!!open}};
const attIntervalsLabel=a=>(a?.segments||[a]).filter(Boolean).map(x=>`${fa(x.in||'—')}–${fa(x.out||'در حال کار')}`).join(' · ');
const attReasonName=code=>({cleaning:'تمیزکاری',client_visit:'مراجعه',center_work:'کارهای داخل مرکز',other:'غیره…'}[code]||code||'—');
const attAuditLabel=a=>(a?.segments||[a]).filter(Boolean).map((x,i)=>`بازهٔ ${fa(i+1)}: ${fa(x.in||'—')}–${fa(x.out||'در حال کار')} · مشمول حقوق ${durationLabel(workMin(x))}${x.approvalStatus==='pending'?` · در انتظار تأیید (${durationLabel(x.requestExtraMinutes||0)})`:x.approvalStatus==='approved'?` · اضافه‌کاری تأییدشده`:x.approvalStatus==='rejected'?` · اضافه‌کاری ردشده`:''}${x.reasonCode?' · علت '+attReasonName(x.reasonCode):''}${x.reasonText?' — '+esc(x.reasonText):''}`).join(' ؛ ');
const shiftWindow=(pid,date)=>{const sc=schedFor(pid,date);return sc?{start:hm(sc.from),end:hm(sc.to)}:null};
const inPersonAppointments=date=>Store.all('appts').filter(a=>String(a.date)===String(date)&&a.status!=='cancelled'&&!(a.done&&a.status==='cancelled')&&a.serviceMode!=='online');
function plannedSessionWindow(date){const ap=inPersonAppointments(date);if(!ap.length)return null;const start=Math.min(...ap.map(a=>hm(a.time||'00:00')))-30,end=Math.max(...ap.map(a=>hm(a.time||'00:00')+(+a.durationMinutes||60)))+30;return{start:Math.max(0,start),end:Math.min(1440,end),appointments:ap}}
function completedSessionWindow(date){const ap=inPersonAppointments(date).filter(a=>a.done||a.status==='done');if(!ap.length)return null;const start=Math.min(...ap.map(a=>hm(a.time||'00:00')))-30;let end=Math.max(...ap.map(a=>{let e=hm(a.end||'');if(!a.end)e=hm(a.time||'00:00')+(+a.durationMinutes||60);if(a.endDate&&a.endDate>date)e+=1440;return e}))+30;return{start:Math.max(0,start),end:Math.min(1440,end),appointments:ap}}
function rawAttendanceMinutes(a,now=T()){if(!a?.in)return 0;const start=hm(a.in),date=String(a.date||''),end=a.out?hm(a.out):(date===now.key?hm(now.time):start);return Math.max(0,end-start)}
function attendanceEndForPolicy(a,now=T()){if(a?.out)return hm(a.out);const start=hm(a?.in||'00:00'),date=String(a?.date||'');if(date===now.key)return hm(now.time);const regular=shiftWindow(a.pid,date),session=completedSessionWindow(date)||plannedSessionWindow(date);return Math.max(start,regular?.end||0,session?.end||0)}
function overlapMinutes(start,end,windows){const ranges=(windows||[]).filter(w=>w&&Number.isFinite(w.start)&&Number.isFinite(w.end)&&w.end>w.start).map(w=>[Math.max(start,w.start),Math.min(end,w.end)]).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);let total=0,lo=null,hi=null;for(const [a,b]of ranges){if(lo===null){lo=a;hi=b}else if(a<=hi)hi=Math.max(hi,b);else{total+=hi-lo;lo=a;hi=b}}if(lo!==null)total+=hi-lo;return Math.max(0,total)}
function workMin(a){if(!a)return 0;if(Array.isArray(a.segments))return a.segments.reduce((sum,x)=>sum+workMin(x),0);const raw=rawAttendanceMinutes(a);if(!Number(a.payrollPolicyVersion))return raw;if(a.approvalStatus==='approved')return raw;const start=hm(a.in||'00:00'),end=attendanceEndForPolicy(a),windows=[];const regular=shiftWindow(a.pid,a.date);if(regular)windows.push(regular);const session=completedSessionWindow(a.date)||plannedSessionWindow(a.date);if(session)windows.push(session);return overlapMinutes(start,end,windows)}
const monthMin=(pid,mo)=>Store.all('att').filter(a=>String(a.pid)===String(pid)&&(a.date||'').startsWith(mo)).reduce((s,a)=>s+workMin(a),0);
function extraAttendanceMinutes(a){const raw=rawAttendanceMinutes(a),paid=workMin(a);return Math.max(0,raw-paid)}
function attendanceNeedsReason(pid,date,time){const m=hm(time),regular=shiftWindow(pid,date);if(regular&&m>=regular.start&&m<=regular.end)return false;const session=plannedSessionWindow(date);return !(session&&m>=session.start&&m<=session.end)}
function notifyMissingAttendanceExit(pid,date){const row=attOpen(pid,date);if(!row)return;const now=T();const sc=shiftWindow(pid,date),planned=plannedSessionWindow(date),completed=completedSessionWindow(date),active=inPersonAppointments(date).some(a=>a.status==='in_progress');if(active)return;const deadline=Math.max(sc?.end||0,completed?.end||0,planned?.end||0);if(deadline&&(String(date)!==now.key||hm(now.time)>deadline)){const p=Store.all('people').find(x=>String(x.id)===String(pid))||{},key=`missed-out:${pid}:${date}:${row.id}`,deadlineText=fa(String(Math.floor(deadline/60)).padStart(2,'0')+':'+String(deadline%60).padStart(2,'0'));clinicNotice('admin',key,'خروج منشی ثبت نشده',`${p.name||'منشی'} تا پایان بازهٔ قابل‌محاسبه ${deadlineText} خروج نزده است؛ حقوق خودکار فقط تا سقف بازه محاسبه می‌شود.`);clinicNotice('secretary:'+pid,key,'یادآوری ثبت خروج','از سقف محاسبهٔ خودکار گذشته‌اید؛ خروج را ثبت کنید. زمان پس از سقف خودکار به حقوق اضافه نمی‌شود.')}}
function issues(pid){const out=[],tol=+Store.cfg('tol',10),now=T();let since=Store.cfg('since',null);if(!since){since=now.key;Store.setCfg('since',since)}
 for(const p of Store.all('people').filter(p=>p.type==='secretary'&&(!pid||p.id===pid)))for(let i=0;i<4;i++){const k=dayKey(i);if(k<since)continue;const sc=schedFor(p.id,k);if(!sc)continue;
  const r=attForDay(p.id,k),nm=p.name+' — '+fa(k)+': ',push=t=>out.push({t:nm+t,pid:p.id,k});
  if(!r){if(!dayInfo(k).hol&&(i>0||hm(now.time)>hm(sc.to)))push('ورود ثبت نشده (غیبت)');continue}
  if(hm(r.in)>hm(sc.from)+tol)push('ورود با '+durationLabel(hm(r.in)-hm(sc.from))+' تأخیر');
  if(hm(r.in)<hm(sc.from)-tol)push('ورود زودتر از برنامه ('+durationLabel(hm(sc.from)-hm(r.in))+')');
  if(!r.out){if(i>0||hm(now.time)>hm(sc.to)+tol){push('خروج ثبت نشده');notifyMissingAttendanceExit(p.id,k)}}else if(hm(r.out)<hm(sc.to)-tol)push('خروج زودتر از برنامه');if((r.segments||[r]).some(a=>['pending','needs_reason'].includes(a.approvalStatus)))push('درخواست اضافه‌کاری در انتظار بررسی')}
 return out}

<script>
/* ============================================================================
   لایهٔ «اتصال داده» میان سه برنامهٔ مستقل
   هر سه برنامه (مدیریت / منشی / ورود و خروج) برنامه‌های جداگانه‌اند و هیچ‌کدام
   راهی برای رفتن به برنامهٔ دیگر ندارند؛ فقط دادهٔ یک مرکز را مشترک می‌خوانند:

     ۱) تغییر داده: هر نوشتن در فضای ذخیرهٔ مشترک، به برنامه‌های دیگر اعلام
        می‌شود (BroadcastChannel + رویداد storage) و آن‌ها بدون بازخوانی صفحه
        همان داده را نمایش می‌دهند.
     ۲) حضور: هر برنامه هر چند ثانیه اعلام می‌کند که باز است؛ بنابراین می‌توان
        دید کدام برنامه‌ها همین حالا به داده متصل‌اند.
     ۳) وضعیت: نشان کوچک در نوار مرکز + شیت جزئیات (بدون هیچ پیوند جابه‌جایی).

   اگر مرورگر ذخیره‌سازی مشترک را مسدود کند (باز کردن فایل با file://)، برنامه
   تنها کار می‌کند و همین موضوع صریحاً نمایش داده می‌شود.
   ========================================================================= */
(function () {
  'use strict';

  var APP = window.CLINIC_SUITE_APP || window.CLINIC_PANEL_ROLE || 'app';
  var ORDER = ['admin', 'secretary', 'attendance'];
  var LABELS = {
    admin: 'پنل مدیریت',
    secretary: 'پنل منشی',
    attendance: 'ورود و خروج'
  };
  var ICONS = { admin: '🗂️', secretary: '🗓️', attendance: '⏱️' };

  var CHANNEL = 'clinic-connection';
  var PRESENCE_KEY = '__clinic_presence';   // عمداً با clinic شروع نمی‌شود تا محرک بازآرایی نشود
  var APPEARANCE_KEY = 'clinicAppearanceMode';
  var HEARTBEAT_MS = 5000;
  var STALE_MS = 13000;

  var instance = Math.random().toString(36).slice(2);
  var channel = null;
  var timer = null;
  var beatTimer = null;
  var pendingRepaint = false;
  var livePeers = {};
  var lastLabel = '';

  /* ---------- توانِ ذخیره‌سازی مشترک ------------------------------------- */
  function storageUsable() {
    try {
      window.localStorage.setItem('__clinic_probe__', '1');
      window.localStorage.removeItem('__clinic_probe__');
      return true;
    } catch (e) {
      return false;
    }
  }
  var fileMode = location.protocol === 'file:';
  var live = storageUsable() && !fileMode;

  /* ---------- حضور -------------------------------------------------------- */
  function readPresence() {
    try {
      var raw = window.localStorage.getItem(PRESENCE_KEY);
      var data = raw ? JSON.parse(raw) : {};
      return data && typeof data === 'object' ? data : {};
    } catch (e) {
      return {};
    }
  }

  function writePresence(map) {
    try { window.localStorage.setItem(PRESENCE_KEY, JSON.stringify(map)); } catch (e) {}
  }

  function beat() {
    if (!live) { renderStatus(); return; }
    var map = readPresence();
    map[APP] = Date.now();
    /* پاک‌سازی ورودی‌های کهنه تا کلید بزرگ نشود */
    Object.keys(map).forEach(function (id) {
      if (id !== APP && Date.now() - (map[id] || 0) > STALE_MS) delete map[id];
    });
    writePresence(map);
    post({ type: 'beat', app: APP });
    renderStatus();
  }

  function peers() {
    if (!live) return [];
    var map = readPresence();
    var now = Date.now();
    var out = [];
    ORDER.forEach(function (id) {
      if (id === APP) return;
      var at = Math.max(map[id] || 0, livePeers[id] || 0);
      if (at && now - at < STALE_MS) out.push({ id: id, at: at });
    });
    return out;
  }

  function leave() {
    if (!live) return;
    var map = readPresence();
    delete map[APP];
    writePresence(map);
    post({ type: 'bye', app: APP });
  }

  /* ---------- انتشار تغییرات --------------------------------------------- */
  function post(message) {
    if (!channel) return;
    try {
      message.from = instance;
      channel.postMessage(message);
    } catch (e) {}
  }

  var hasOverlay = function () { return !!document.querySelector('.ov'); };

  function repaint() {
    if (typeof Store === 'undefined') return;
    try { Store.refresh(); } catch (e) {}
    if (hasOverlay()) { pendingRepaint = true; return; }
    if (typeof App !== 'undefined' && typeof App.refresh === 'function') {
      try { App.refresh(); } catch (e) {}
    }
    flash();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(repaint, 140);
  }

  if (!window.__clinicConnectionPatched) {
    window.__clinicConnectionPatched = true;
    try {
      var nativeSet = Storage.prototype.setItem;
      Storage.prototype.setItem = function (key, value) {
        nativeSet.call(this, key, value);
        var name = String(key);
        if (name.indexOf('clinic') === 0 && name !== APPEARANCE_KEY) post({ type: 'change', key: name });
      };
    } catch (e) {}
  }

  try {
    channel = new BroadcastChannel(CHANNEL);
    channel.addEventListener('message', function (event) {
      var data = event.data || {};
      if (!data.from || data.from === instance) return;
      if (data.type === 'change') { schedule(); return; }
      if (data.type === 'beat' && data.app) { livePeers[data.app] = Date.now(); renderStatus(); return; }
      if (data.type === 'bye' && data.app) { delete livePeers[data.app]; renderStatus(); }
    });
  } catch (e) {
    channel = null;
  }

  window.addEventListener('storage', function (event) {
    var key = event.key || '';
    if (!key) { schedule(); renderStatus(); return; }
    if (key === PRESENCE_KEY) { renderStatus(); return; }
    if (key === APPEARANCE_KEY) return;
    if (key.indexOf('clinic') !== 0) return;
    schedule();
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { beat(); renderStatus(); }
  });
  window.addEventListener('pagehide', leave);
  window.addEventListener('pageshow', function (event) { if (event.persisted) beat(); });

  function watchOverlay() {
    if (!document.body || typeof MutationObserver === 'undefined') return;
    new MutationObserver(function () {
      if (pendingRepaint && !hasOverlay()) { pendingRepaint = false; repaint(); }
    }).observe(document.body, { childList: true, subtree: true });
  }

  /* ---------- نمایش وضعیت ------------------------------------------------ */
  var flashTimer = null;
  function flash() {
    var pill = document.querySelector('.sync-status');
    if (!pill || !live) return;
    pill.classList.add('is-flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { pill.classList.remove('is-flash'); }, 700);
  }

  function cloud() {
    return window.ClinicCloud && window.ClinicCloud.enabled ? window.ClinicCloud.status() : null;
  }

  function labelFor(connected) {
    var c = cloud();
    if (c) {
      if (!c.active) return 'در انتظار لایسنس';
      var count = c.sessions ? c.sessions.length : 0;
      return count > 1 ? 'متصل · ' + count + ' دستگاه' : 'متصل';
    }
    if (!live) return 'بدون اتصال';
    if (connected >= 3) return '۳ برنامه متصل';
    if (connected === 2) return '۲ برنامه متصل';
    return 'فقط این برنامه';
  }

  function statusText() {
    var c = cloud();
    if (c) {
      if (!c.active) return 'این برنامه هنوز با لایسنس وصل نشده است؛ بدون لایسنس داده نمایش داده نمی‌شود.';
      return 'دادهٔ مرکز نگه‌داری می‌شود و تغییرها بین دستگاه‌های همین لایسنس جابه‌جا می‌شوند.';
    }
    if (!live) {
      return fileMode
        ? 'این برنامه مستقیم از فایل باز شده است؛ برای اتصال داده به دو برنامهٔ دیگر، آن را از پایگاه محلی یا دامنهٔ مشترک باز کنید.'
        : 'مرورگر ذخیره‌سازی مشترک را مسدود کرده است؛ دادهٔ این برنامه با برنامه‌های دیگر همگام نمی‌شود.';
    }
    return 'دادهٔ این برنامه با برنامه‌های متصل، زنده به‌اشتراک گذاشته می‌شود.';
  }

  function renderStatus() {
    var bar = document.querySelector('.center-context');
    if (!bar) return;
    var pill = bar.querySelector('.sync-status');
    if (!pill) {
      pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'sync-status';
      pill.addEventListener('click', openStatus);
      bar.appendChild(pill);
    }
    var list = peers();
    var connected = 1 + list.length;
    var c = cloud();
    var state = c
      ? (c.active ? 'server' : 'pending')
      : (!live ? 'solo' : list.length ? 'connected' : 'alone');
    var label = labelFor(connected);
    if (pill.dataset.state !== state || pill.dataset.label !== label) {
      pill.dataset.state = state;
      pill.dataset.label = label;
      pill.classList.toggle('is-offline', state === 'solo' || state === 'pending' || state === 'alone');
      pill.innerHTML = '<span class="sync-dot" aria-hidden="true"></span><span class="sync-label">' + label + '</span>';
      pill.setAttribute('aria-label', 'وضعیت اتصال داده: ' + label);
    }
    pill.title = statusText();
    lastLabel = label;
  }

  function cloudBlock(c) {
    if (!c) return '';
    if (!c.active) {
      return '<div class="conn-row is-off"><span class="conn-icon" aria-hidden="true">🔒</span>' +
        '<span class="conn-name"><b>متصل نشده</b><small>برای اتصال، کلید لایسنس را وارد کنید</small></span>' +
        '<button type="button" class="btn sm" data-cloud-login>اتصال</button></div>';
    }
    var license = c.license || {};
    var expiry = license.expires_at ? new Date(license.expires_at).toLocaleDateString('fa-IR') : 'بدون محدودیت';
    return '<div class="conn-row is-on"><span class="conn-icon" aria-hidden="true">☁️</span>' +
      '<span class="conn-name"><b>' + (c.center ? c.center.name : 'مرکز') + '</b>' +
      '<small>مرکز + ' · اعتبار لایسنس تا ' + expiry + ' · نسخهٔ داده ' + c.revision + '</small></span>' +
      '<span class="conn-dot" aria-hidden="true"></span></div>' +
      '<div class="conn-row ' + (c.error ? 'is-off' : 'is-on') + '"><span class="conn-icon" aria-hidden="true">' + (c.error ? '⚠️' : '✅') + '</span>' +
      '<span class="conn-name"><b>' + (c.error ? 'خطا در همگام‌سازی' : 'همگام‌سازی سالم') + '</b>' +
      '<small>' + (c.error ? c.error : (c.pending ? c.pending + ' تغییر در صف ارسال' : 'همهٔ تغییرها ذخیره شده‌اند')) + '</small></span>' +
      '<span class="conn-dot" aria-hidden="true"></span></div>';
  }

  function cloudDevices(c) {
    if (!c || !c.active || !c.sessions || !c.sessions.length) return '';
    var rows = c.sessions.map(function (item) {
      return '<div class="conn-row is-on"><span class="conn-icon" aria-hidden="true">' + (ICONS[item.panel] || '•') + '</span>' +
        '<span class="conn-name"><b>' + (LABELS[item.panel] || item.panel) + (item.is_current ? ' · همین دستگاه' : '') + '</b>' +
        '<small>' + (item.device || 'دستگاه') + ' · ' + Math.max(1, Math.round((Date.now() - Date.parse(item.last_seen)) / 1000)) + ' ثانیه پیش</small></span>' +
        '<span class="conn-dot" aria-hidden="true"></span></div>';
    }).join('');
    return '<h4 style="margin:14px 2px 8px;font-size:12.5px">دستگاه‌های متصل</h4><div class="conn-list">' + rows + '</div>';
  }

  function statusHtml() {
    var c = cloud();
    if (c) {
      return '<div class="conn-list">' + cloudBlock(c) + '</div>' + cloudDevices(c) +
        '<p class="conn-note">' + statusText() + '</p>' +
        '<p class="conn-note">این برنامه فقط به مرکز تعریف‌شده با همین لایسنس متصل است.</p>' +
        
        '<button type="button" class="btn big" id="connClose">بستن</button>';
    }
    var list = peers();
    var byId = {};
    list.forEach(function (peer) { byId[peer.id] = peer.at; });
    var rows = ORDER.map(function (id) {
      var self = id === APP;
      var at = byId[id];
      var state = self ? 'همین برنامه' : at ? 'متصل' : (live ? 'بسته' : 'نامشخص');
      var tone = self ? 'is-self' : at ? 'is-on' : 'is-off';
      var when = at ? ' · آخرین فعالیت ' + Math.max(1, Math.round((Date.now() - at) / 1000)) + ' ثانیه پیش' : '';
      return '<div class="conn-row ' + tone + '">' +
        '<span class="conn-icon" aria-hidden="true">' + (ICONS[id] || '•') + '</span>' +
        '<span class="conn-name"><b>' + (LABELS[id] || id) + '</b><small>' + state + when + '</small></span>' +
        '<span class="conn-dot" aria-hidden="true"></span>' +
        '</div>';
    }).join('');

    return '<div class="conn-list">' + rows + '</div>' +
      '<p class="conn-note">' + statusText() + '</p>' +
      '<p class="conn-note">این سه برنامه کاملاً مستقل نصب و اجرا می‌شوند؛ فقط دادهٔ مرکز را با هم به اشتراک می‌گذارند. برای اتصال، باید روی یک دامنه () باز شوند.</p>' +
      '<button type="button" class="btn big" id="connClose">بستن</button>';
  }

  function openStatus() {
    return; // بخش سرور در منشی/ورود-خروج حذف شده
    if (typeof sheet !== 'function') return;
    sheet('اتصال داده', statusHtml(), function (box, close) {
      var button = box.querySelector('#connClose');
      if (button) button.onclick = close;
      
      var connect = box.querySelector('[data-cloud-login]');
      if (connect) connect.onclick = function () { close(); window.ClinicCloud.openGate(); };
    });
  }

  function boot() {
    watchOverlay();
    beat();
    clearInterval(beatTimer);
    beatTimer = setInterval(beat, HEARTBEAT_MS);
    if (typeof MutationObserver !== 'undefined' && document.body) {
      new MutationObserver(renderStatus).observe(document.body, { childList: true, subtree: true });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }

  window.ClinicConnection = {
    panel: APP,
    isLive: function () { return live; },
    peers: function () { return peers().map(function (peer) { return peer.id; }); },
    connectedCount: function () { return 1 + peers().length; },
    label: function () { return lastLabel; },
    status: function () {
      return { live: live, fileMode: fileMode, panel: APP, peers: peers().map(function (p) { return p.id; }) };
    },
    open: openStatus,
    paint: renderStatus,
    refresh: schedule
  };
})();
</script>
<script>
/* ============================================================================
   راه‌اندازی هر برنامه به‌صورت مستقل
   — پیوند مستقیم به یک بخش از همین برنامه:  ?tab=<id>
   — ثبت سرویس‌ورکر همین برنامه برای اجرای آفلاین
   — دکمهٔ «نصب» وقتی مرورگر امکان نصب این برنامه را بدهد
   هیچ‌کدام از این‌ها ارتباطی با برنامه‌های دیگر ندارد.
   ========================================================================= */
(function () {
  'use strict';

  var tab = new URLSearchParams(window.location.search).get('tab');
  if (tab && typeof App !== 'undefined' && typeof App.goto === 'function') {
    try { App.goto(tab); } catch (e) {}
  }

  /* ---------- برداشتن صفحهٔ راه‌اندازی ----------------------------------- */
  function hideSplash() {
    var splash = document.getElementById('appSplash');
    if (!splash || splash.classList.contains('is-hiding')) return;
    splash.classList.add('is-hiding');
    setTimeout(function () { splash.classList.add('is-done'); }, 320);
  }

  function whenReady() {
    if (document.querySelector('header.top')) { hideSplash(); return; }
    if (typeof MutationObserver === 'undefined') { hideSplash(); return; }
    var observer = new MutationObserver(function () {
      if (document.querySelector('header.top')) { observer.disconnect(); hideSplash(); }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(function () { observer.disconnect(); hideSplash(); }, 4000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', whenReady, { once: true });
  } else {
    whenReady();
  }

  /* ---------- سرویس‌ورکر: آفلاین و نصب‌پذیری همین برنامه ------------------ */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    });
  }

  /* ---------- دکمهٔ نصب، فقط اگر مرورگر اجازه بدهد ------------------------ */
  var promptEvent = null;
  var installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function mountInstall() {
    var header = document.querySelector('header.top');
    if (!header || installed || !promptEvent) return;
    if (header.querySelector('#appInstall')) return;
    var button = document.createElement('button');
    button.type = 'button';
    button.id = 'appInstall';
    button.className = 'menu-trigger app-install-trigger';
    button.setAttribute('aria-label', 'نصب این برنامه روی دستگاه');
    button.setAttribute('title', 'نصب این برنامه');
    button.textContent = '⬇';
    button.addEventListener('click', function () {
      if (!promptEvent) return;
      promptEvent.prompt();
      promptEvent.userChoice.then(function () { promptEvent = null; button.remove(); }).catch(function () {});
    });
    header.appendChild(button);
  }

  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    promptEvent = event;
    mountInstall();
  });
  window.addEventListener('appinstalled', function () {
    installed = true;
    var button = document.querySelector('#appInstall');
    if (button) button.remove();
  });

  if (typeof MutationObserver !== 'undefined' && document.body) {
    new MutationObserver(mountInstall).observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
</body></html>
